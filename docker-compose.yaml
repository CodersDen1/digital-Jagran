# Coolify Git-based Docker Compose deployment. Supply secrets in Coolify only.
services:
  publication:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 40s
    # Explicit deployment bootstrap: additive index provisioning before startup.
    command: [sh, -ec, ': "$${ADMIN_PASSWORD:?Set newsroom password}"; : "$${TRUST_PROXY:?Set proxy network}"; node newsroom/indexes.js --apply; exec node index.js']
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '5001'
      METRICS_PORT: '9464'
      DATA_STORE: mongo
      SEED_DEMO: 'false'
      PUBLIC_ORIGIN: '${PUBLIC_ORIGIN:-https://digitaljagran.com}'
      ADMIN_EMAIL: '${ADMIN_EMAIL:-editor@digitaljagran.com}'
      ADMIN_PASSWORD: '${ADMIN_PASSWORD:-}'
      MONGODB_URI: 'mongodb://digitaljagran:${MONGO_APP_PASSWORD:-}@digital-jagran-mongo:27017/digital_jagran?authSource=digital_jagran&replicaSet=djrs'
      TRUST_PROXY: '${TRUST_PROXY:-}'
      ALLOWED_ORIGINS: 'https://digitaljagran.com,https://www.digitaljagran.com,https://server.digitaljagran.com'
      MONGO_MAX_POOL_SIZE: '20'
      MONGO_MIN_POOL_SIZE: '0'
      MONGO_WAIT_QUEUE_TIMEOUT_MS: '2000'
      MONGO_OPERATION_TIMEOUT_MS: '5000'
      DRAIN_TIMEOUT_MS: '30000'
      NODE_OPTIONS: --max-old-space-size=320
    expose: ['5001']
    healthcheck:
      test: [CMD, node, -e, 'require("http").get("http://127.0.0.1:5001/health/ready",r=>process.exit(r.statusCode===200?0:1)).on("error",()=>process.exit(1))']
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 90s
    depends_on:
      digital-jagran-mongo:
        condition: service_healthy
    networks: [default, database]
  digital-jagran-mongo:
    image: mongo:8.0
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: '${MONGO_ROOT_PASSWORD:-}'
      MONGO_APP_PASSWORD: '${MONGO_APP_PASSWORD:-}'
    entrypoint:
      - bash
      - -ec
      - |
        : "$${MONGO_INITDB_ROOT_PASSWORD:?Set root database password}"
        : "$${MONGO_APP_PASSWORD:?Set application database password}"
        if [ ! -s /data/configdb/replica.key ]; then
          umask 077
          openssl rand -base64 756 > /data/configdb/replica.key
        fi
        chown mongodb:mongodb /data/configdb/replica.key
        chmod 400 /data/configdb/replica.key
        exec docker-entrypoint.sh mongod --replSet djrs --bind_ip_all --keyFile /data/configdb/replica.key --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    # Bootstrap only this fresh replica set and its least-privileged app user.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval '
          const admin=db.getSiblingDB("admin");
          if(!admin.auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD)) quit(1);
          try { rs.status(); } catch(e) {
            if(e.code===94) { rs.initiate({_id:"djrs",members:[{_id:0,host:"digital-jagran-mongo:27017"}]}); quit(1); }
            throw e;
          }
          if(!db.hello().isWritablePrimary) quit(1);
          const app=db.getSiblingDB("digital_jagran");
          if(!app.getUser("digitaljagran")) app.createUser({user:"digitaljagran",pwd:process.env.MONGO_APP_PASSWORD,roles:[{role:"readWrite",db:"digital_jagran"}]});
          quit(0);'
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 30s
    networks: [database]
volumes:
  mongo-data:
  mongo-config:
networks:
  database:
    internal: true
