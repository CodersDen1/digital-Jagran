apiVersion: v1
kind: Service
metadata:
  name: {{ include "dj.name" . }}
  labels:
    {{- include "dj.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dj.webSelector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dj.name" . }}-metrics
  labels:
    {{- include "dj.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    {{- include "dj.webSelector" . | nindent 4 }}
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
